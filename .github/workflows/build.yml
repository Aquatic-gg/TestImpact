name: build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle and validate the wrapper
        uses: gradle/actions/setup-gradle@v6
      - name: Build
        shell: bash
        run: ./gradlew build :build-logic:validatePlugins --warning-mode=fail --stacktrace
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.os }}
          path: '**/build/reports/'
          if-no-files-found: ignore

  compat:
    name: compat (${{ matrix.os }}, JDK ${{ matrix.jdk }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            jdk: '21'
          - os: ubuntu-latest
            jdk: '25'
          - os: windows-latest
            jdk: '25'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            ${{ matrix.jdk }}
      - name: Set up Gradle and validate the wrapper
        uses: gradle/actions/setup-gradle@v6
      - name: Test on JDK ${{ matrix.jdk }}
        shell: bash
        run: >-
          ./gradlew :plugin:test
          -Ptestimpact.testJava=${{ matrix.jdk }}
          -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_${{ matrix.jdk }}_X64
          --warning-mode=fail --stacktrace
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-compat-${{ matrix.os }}-${{ matrix.jdk }}
          path: '**/build/reports/'
          if-no-files-found: ignore
